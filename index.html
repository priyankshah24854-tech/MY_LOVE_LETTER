<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Letter For You ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            animation: fadeIn 1.5s ease-in-out;
        }

        .heart {
            font-size: 50px;
            animation: beat 0.8s infinite alternate;
            margin-bottom: 10px;
        }

        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .yes-btn {
            background-color: #ff4b2b;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }

        .yes-btn:hover {
            transform: scale(1.1);
        }

        .no-btn {
            background-color: #eee;
            color: #333;
            position: absolute;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Celebration Screen */
        .celebration {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="heart">💌</div>
        <h1>Hey Special Person! ✨</h1>
        <p>Aapki smile se mera din ban jata hai. Kya hum hamesha ke liye ache dost / saath reh sakte hain? 💖</p>
        
        <div class="btn-group" style="height: 50px;">
            <button class="yes-btn" onclick="sayYes()">Haan, Bilkul! 🥰</button>
            <button class="no-btn" id="noBtn" onmouseover="moveButton()">Nahi 😜</button>
        </div>
    </div>

    <div class="card celebration" id="happyCard">
        <div class="heart">🎉❤️</div>
        <h1>Yaaaaay! I knew it! 🙈</h1>
        <p>Aapne mera din banadiya! Thank you for being in my life! ✨🌹</p>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            // Generate random positions
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function sayYes() {
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('happyCard').style.display = 'block';
        }
    </script>
</body>
</html>
